services:
  db:
    image: postgres:15-alpine
    container_name: secret_santa_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secret_santa}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Убираем проброс порта наружу - доступ только из внутренней сети Docker
    # Это защищает от брутфорса из интернета
    # ports:
    #   - "5432:5432"
    # Если нужен доступ извне, используйте SSH туннель или VPN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Дополнительные настройки безопасности
    # Примечание: некоторые параметры логирования могут не поддерживаться в alpine версии
    command: >
      postgres
      -c log_connections=on
      -c log_disconnections=on
      -c authentication_timeout=10s

  bot:
    build: .
    container_name: secret_santa_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-secret_santa}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
    internal: false  # Allow outbound connections for bot API

volumes:
  postgres_data:
